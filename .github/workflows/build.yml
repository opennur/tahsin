name: CI — Build, Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-integrity:
    name: Quran content integrity (canonical source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate all bundled ayahs
        run: python3 tools/validate_quran_content.py

      - name: Validate bundled Quran fields
        run: python3 tools/validate_quran_fields.py

  lint:
    name: Lint (detekt + Android lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Menerima lisensi SDK + menyediakan android-35 (compileSdk 35).
      - uses: android-actions/setup-android@v3

      # gradle.properties berisi override khusus Termux (aapt2/aidl) yang
      # tidak ada di runner CI — hapus supaya AGP memakai versi dari Maven.
      - name: Clear Termux-only Gradle overrides
        run: |
          sed -i '/android.aapt2FromMavenOverride/d; /android.aidlExecutable/d' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: detekt (static analysis Kotlin)
        run: ./gradlew detekt --no-daemon

      - name: Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/detekt/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  unit-test:
    name: Unit tests (JVM + Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Clear Termux-only Gradle overrides
        run: |
          sed -i '/android.aapt2FromMavenOverride/d; /android.aidlExecutable/d' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      # Unit test JVM murni + Robolectric (Android framework headless).
      # Robolectric mengunduh android-all jar dari Maven Central saat tes.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Laporan cakupan inti kebenaran (data/ + util murni + TranscriptAligner).
      - name: JaCoCo core report
        run: ./gradlew jacocoCoreReport --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/jacoco/**
          if-no-files-found: ignore

  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    needs: [content-integrity, lint, unit-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Clear Termux-only Gradle overrides
        run: |
          sed -i '/android.aapt2FromMavenOverride/d; /android.aidlExecutable/d' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # R8 is currently disabled in app/build.gradle.kts after a device launch
      # regression; this still verifies the release packaging path.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
