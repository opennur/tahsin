name: Security — MobSF scan

# Scan keamanan statis APK release dengan MobSF (docker).
# Dijalankan otomatis saat tag rilis (v*) atau manual via "Run workflow".
# SecDroid (scanner on-device) tidak bisa diotomasikan di CI — dipakai
# sebagai langkah QA manual (lihat docs/SECURITY.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mobsf:
    name: MobSF static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Clear Termux-only Gradle overrides
        run: |
          sed -i '/android.aapt2FromMavenOverride/d; /android.aidlExecutable/d' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare MobSF report directory
        run: mkdir -p mobsf-report

      - name: Run MobSF scan
        uses: fundacaocerti/mobsf-action@v1.7.2
        env:
          INPUT_FILE_NAME: app/build/outputs/apk/release/app-release.apk
          SCAN_TYPE: apk
          OUTPUT_FILE_NAME: mobsf-report/mobsf-report

      - name: Upload MobSF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-report
          path: mobsf-report/
          if-no-files-found: ignore
