[versions]
agp = "8.4.0"
kotlin = "2.0.20"
coreKtx = "1.12.0"
lifecycle = "2.7.0"
activityCompose = "1.8.2"
composeBom = "2024.10.00"
coroutines = "1.8.1"
gson = "2.10.1"
junit = "4.13.2"

# DI (Hilt) — kapt dipakai karena KSP tidak menerbitkan biner linux-arm64
# (lihat README "Alasan kapt, bukan KSP").
hilt = "2.51.1"

# Penyimpanan preferensi modern (pengganti SharedPreferences).
datastore = "1.1.1"

# Testing: Robolectric (JVM headless) + Turbine + Truth.
robolectric = "4.14.1"
turbine = "1.1.0"
truth = "1.4.4"
androidxTestCore = "1.6.1"

# Linter Kotlin (static analysis).
detekt = "1.23.7"

[libraries]
# AndroidX core / lifecycle / activity
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (BOM 2024.10.00) — TANPA Material 3, custom design system sendiri
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# JSON parsing (mushaf asset)
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# DI — Hilt (Dagger)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Penyimpanan preferensi modern — pengganti SharedPreferences
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Unit test (JVM)
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Robolectric — Android framework berjalan headless di JVM (tanpa emulator)
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Turbine — pengujian Flow/StateFlow (emisi satu per satu)
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Truth — assertion yang readable & flow-friendly (alternatif Assert.*)
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

# ApplicationProvider.getApplicationContext() di test Robolectric
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
